<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#text-grad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .tag { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    .node-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #cbd5e1; }
    
    @keyframes pulse {
      0% { r: 4px; opacity: 0.4; }
      50% { r: 8px; opacity: 1; }
      100% { r: 4px; opacity: 0.4; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    
    .pulsing-dot { animation: pulse 3s infinite ease-in-out; }
    .floating-card { animation: float 6s infinite ease-in-out; }
    .animated-line { stroke-dasharray: 8 6; animation: dash 20s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="2"/>

  <!-- Background Decorative Grid & Nodes (Dynamic background layer) -->
  <g opacity="0.25">
    <line x1="100" y1="40" x2="1100" y2="40" stroke="#475569" stroke-width="1"/>
    <line x1="100" y1="260" x2="1100" y2="260" stroke="#475569" stroke-width="1"/>
    <line x1="200" y1="20" x2="200" y2="280" stroke="#475569" stroke-width="1"/>
    <line x1="1000" y1="20" x2="1000" y2="280" stroke="#475569" stroke-width="1"/>
    
    <!-- Flow connection lines -->
    <path d="M 850,70 Q 950,150 850,230" fill="none" stroke="#6366f1" stroke-width="2" class="animated-line"/>
    <path d="M 1000,90 Q 900,150 1000,210" fill="none" stroke="#0ea5e9" stroke-width="2" class="animated-line"/>
  </g>

  <!-- Background Floating Decorative Elements (kept away from center text) -->
  <g class="floating-card" transform="translate(920, 50)" opacity="0.7">
    <rect width="180" height="60" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="15" y="25" class="tag">AI Screening Match</text>
    <text x="15" y="45" class="node-text">Recall: &gt;90% | Precision</text>
    <circle cx="155" cy="30" r="5" fill="#10b981" class="pulsing-dot"/>
  </g>

  <g class="floating-card" transform="translate(940, 180)" opacity="0.7" style="animation-delay: -3s;">
    <rect width="180" height="60" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="15" y="25" class="tag" fill="#a78bfa">OMOP CDM &amp; FHIR</text>
    <text x="15" y="45" class="node-text">Interoperable EHR</text>
    <circle cx="155" cy="30" r="5" fill="#6366f1" class="pulsing-dot"/>
  </g>

  <g transform="translate(70, 60)" opacity="0.5">
    <circle cx="40" cy="40" r="30" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="40" cy="40" r="6" fill="#38bdf8" class="pulsing-dot"/>
  </g>

  <g transform="translate(75, 190)" opacity="0.5">
    <rect width="50" height="50" rx="8" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="25" cy="25" r="5" fill="#a78bfa" class="pulsing-dot"/>
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Clear and unobstructed) -->
  <g transform="translate(180, 115)">
    <!-- Category Pill -->
    <g transform="translate(0, -55)">
      <rect width="290" height="28" rx="14" fill="url(#pill-grad)" stroke="#0284c7" stroke-width="1"/>
      <text x="14" y="18" class="tag">🧬 CLINICAL TRIALS &amp; PRECISION MEDICINE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="10" class="title" filter="url(#glow)">Awesome Clinical Trial Matching</text>

    <!-- Subtitle -->
    <text x="0" y="48" class="subtitle">Curated Ecosystem of AI SaaS Platforms &amp; Open-Source Engines</text>
    <text x="0" y="75" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14">Patient Recruitment • Biomarker Alignment • EHR NLP • OMOP/FHIR Interoperability</text>
  </g>
</svg>
